<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- A 字母主体 -->
  <g filter="url(#shadow)">
    <!-- A 左斜边 -->
    <path 
      d="M35,175 L78,35 L92,35 L92,120 L50,175 Z" 
      fill="url(#aiGradient)"
    />
    <!-- A 右斜边 -->
    <path 
      d="M165,175 L122,35 L108,35 L108,120 L150,175 Z" 
      fill="url(#aiGradient)"
    />
    <!-- A 顶部 -->
    <path 
      d="M78,35 L122,35 L122,75 L78,75 Z" 
      fill="url(#aiGradient)"
    />
    <!-- A 内部空心部分 -->
    <path 
      d="M92,75 L108,75 L108,120 L92,120 Z" 
      fill="#ffffff"
    />
    <!-- A 底部连接 -->
    <path 
      d="M50,175 L150,175 L142,160 L58,160 Z" 
      fill="url(#aiGradient)"
    />
  </g>
  
  <!-- A 内部电路图案 -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主电路线 Y型 -->
    <path d="M68,155 L85,135 L100,135 L115,135 L132,155" />
    <!-- 左侧分支 -->
    <path d="M85,135 L85,115" />
    <!-- 右侧分支 -->
    <path d="M115,135 L115,115" />
  </g>
  
  <!-- 电路节点 -->
  <g fill="#ffffff">
    <circle cx="100" cy="135" r="4" />
    <circle cx="85" cy="135" r="3" />
    <circle cx="115" cy="135" r="3" />
    <circle cx="85" cy="115" r="2.5" />
    <circle cx="115" cy="115" r="2.5" />
    <circle cx="68" cy="155" r="2.5" />
    <circle cx="132" cy="155" r="2.5" />
  </g>
  
  <!-- I 字母 -->
  <g filter="url(#shadow)">
    <!-- I 顶部 -->
    <rect x="148" y="30" width="28" height="10" rx="5" fill="url(#aiGradient)" />
    <!-- I 主体 -->
    <rect x="156" y="40" width="12" height="125" rx="6" fill="url(#aiGradient)" />
    <!-- I 底部 -->
    <rect x="148" y="165" width="28" height="10" rx="5" fill="url(#aiGradient)" />
  </g>
  
  <!-- I 内部装饰线 -->
  <rect x="160" y="55" width="4" height="100" rx="2" fill="#ffffff" opacity="0.25" />
</svg>
