<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角方形背景 -->
  <rect x="5" y="5" width="90" height="90" rx="16" ry="16" fill="url(#bg)"/>
  
  <!-- 外圈装饰环 -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  
  <!-- 中心文字：万象 -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="900" fill="url(#textGradient)">万象</text>
</svg>
